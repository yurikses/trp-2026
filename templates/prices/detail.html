{% extends 'base.html' %}

{% block title %}{{ price.product.name }}{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3">{{ price.product.name }}</h1>
        <p class="fs-3">{{ price.price|floatformat:2 }} ₽</p>
        <p>Магазин: <a href="{% url 'stores:store-detail' price.store.id %}">{{ price.store.name }}</a></p>
        <p>Обновлено: {{ price.updated_at|date:'d.m.Y H:i' }}</p>
        <a class="btn btn-primary" href="{{ price.url }}" target="_blank" rel="noreferrer">Перейти к предложению</a>
    </div>
</div>
{% endblock %}
