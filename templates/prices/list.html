{% extends 'base.html' %}

{% block title %}Цены{% endblock %}

{% block content %}
<h1 class="mb-4">Цены</h1>
{% if prices %}
<ul class="list-group">
    {% for price in prices %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'prices:price-detail' forloop.counter %}">{{ price.product.name }} в {{ price.store.name }}</a>
        <span>{{ price.price|floatformat:2 }} ₽</span>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="alert alert-info">Цен пока нет.</div>
{% endif %}
{% endblock %}
