{% extends 'base.html' %}

{% block title %}Товары{% endblock %}

{% block content %}
<h1 class="mb-4">Товары <span class="text-muted fs-5">({{ products|length }})</span></h1>
<ul class="list-group">
    {% for product in products %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'products:product-detail' product.id %}">{{ product.name }}</a>
        <span class="badge text-bg-secondary">{{ product.category.name }}</span>
    </li>
    {% empty %}
    <li class="list-group-item text-muted">Товаров пока нет.</li>
    {% endfor %}
</ul>
{% endblock %}
